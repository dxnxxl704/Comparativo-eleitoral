<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparativo Eleitoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen">
      <header class="bg-slate-900 text-white shadow-lg">
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-sky-300">Build to Learn</p>
              <h1 class="text-3xl font-bold">Comparativo Eleitoral</h1>
            </div>
            <div class="flex items-center gap-3 text-sm text-slate-300">
              <span class="rounded-full border border-sky-400/40 bg-sky-400/10 px-3 py-1">Avaliação documental</span>
              <span class="rounded-full border border-emerald-400/40 bg-emerald-400/10 px-3 py-1">Coerência política</span>
            </div>
          </div>
        </div>
      </header>

      <main class="mx-auto max-w-7xl space-y-8 px-4 py-8 sm:px-6 lg:px-8">
        <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-4" id="dashboardMetrics"></section>

        <section class="grid gap-6 xl:grid-cols-[1.4fr_0.9fr]">
          <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
              <div>
                <p class="text-sm font-medium uppercase tracking-[0.16em] text-slate-500">Busca e filtros</p>
                <h2 class="text-xl font-semibold">Candidatos</h2>
              </div>
              <div class="flex flex-wrap gap-2">
                <input id="candidateSearch" type="text" placeholder="Buscar candidato" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none md:w-64" />
                <button id="searchButton" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Buscar</button>
              </div>
            </div>

            <div class="mb-4 grid gap-3 md:grid-cols-4">
              <input id="filterName" type="text" placeholder="Nome" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input id="filterParty" type="text" placeholder="Partido" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input id="filterOffice" type="text" placeholder="Cargo" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input id="filterState" type="text" placeholder="Estado" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
            </div>

            <div id="candidateList" class="space-y-3"></div>
          </div>

          <aside class="space-y-6">
            <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
              <h3 class="mb-4 text-lg font-semibold">Adicionar candidato</h3>
              <form id="candidateForm" class="space-y-3">
                <input name="name" placeholder="Nome" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
                <input name="party" placeholder="Partido" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
                <input name="office" placeholder="Cargo" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
                <input name="state" placeholder="Estado" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
                <textarea name="biography" rows="3" placeholder="Biografia / perfil" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm"></textarea>
                <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">Salvar candidato</button>
              </form>
            </div>

            <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
              <h3 class="mb-4 text-lg font-semibold">Comparar candidatos</h3>
              <div class="space-y-3">
                <input id="compareIds" type="text" placeholder="Ex.: 1,2,3" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
                <button id="compareButton" class="w-full rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Comparar</button>
              </div>
              <div id="comparisonResults" class="mt-4 space-y-3"></div>
            </div>
          </aside>
        </section>

        <section class="grid gap-6 xl:grid-cols-2">
          <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <h3 class="mb-4 text-lg font-semibold">Avaliação</h3>
            <form id="evaluationForm" class="space-y-3">
              <input name="candidate_id" type="number" placeholder="ID do candidato" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="nao_neoliberal" /> Não é neoliberal</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="contra_aborto" /> Não apoia o aborto</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="respeita_cristianismo" /> Respeita o cristianismo</label>
              <textarea name="observacoes" rows="3" placeholder="Observações e justificativa" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm"></textarea>
              <button type="submit" class="w-full rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700">Salvar avaliação</button>
            </form>
          </div>

          <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <h3 class="mb-4 text-lg font-semibold">Fontes e evidências</h3>
            <form id="sourceForm" class="space-y-3">
              <input name="candidate_id" type="number" placeholder="ID do candidato" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input name="title" placeholder="Título da fonte" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input name="url" type="url" placeholder="URL" required class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <input name="type" placeholder="Tipo (vídeo, artigo, declaração...)" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" />
              <textarea name="observation" rows="3" placeholder="Observação da fonte" class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm"></textarea>
              <button type="submit" class="w-full rounded-lg bg-amber-500 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-600">Salvar fonte</button>
            </form>
          </div>
        </section>

        <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
          <div class="mb-4 flex items-center justify-between gap-3">
            <div>
              <p class="text-sm font-medium uppercase tracking-[0.16em] text-slate-500">Relatório</p>
              <h3 class="text-xl font-semibold">Resumo por candidato</h3>
            </div>
            <button id="reloadReports" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-100">Atualizar</button>
          </div>
          <div id="reportList" class="grid gap-4 lg:grid-cols-2"></div>
        </section>
      </main>
    </div>

    <script src="/static/js/app.js"></script>
  </body>
</html>
